[project]
name = "inverse-experimental-framework"
version = "0.1.0"
description = "An 'Inverse' Experimental Framework to Estimate Market Efficiency"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Thomas Asikis", email = "thomas@asikis.ai"},
    {name = "Heinrich Nax", email = "nax@soziologie.uzh.ch"},
]

dependencies = [
    "catboost==1.2.2",
    "numpy==1.26.1",
    "pandas==2.1.1",
    "plotly==5.17.0",
    "scikit-learn==1.3.2",
    "scipy==1.11.3",
    "ipywidgets==8.1.1",
    "seaborn==0.13.0",
    "statsmodels==0.14.0",
    "tqdm==4.66.1",
    "pydantic==2.4.2",
    "pandera[io]==0.17.2",
    "multimethod<2",
    "pyarrow==14.0.0",
    "safetensors==0.4.2",
    "kaleido==0.2.1",
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
    "streamlit>=1.55.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.1.0",
    "torchdiffeq==0.2.3",
    "pyro-ppl==1.8.6",
]
torch-cu121 = [
    "torch>=2.1.0",
    "torchdiffeq==0.2.3",
    "pyro-ppl==1.8.6",
]
jupyter = [
    "jupyterlab>=4.0",
]
dev = [
    "black==23.10.1",
    "nbstripout>=0.6",
    "pytest>=7.0",
]

[tool.uv]
# For CUDA 12.1 torch, use:
# uv sync --extra torch-cu121 --index-url https://download.pytorch.org/whl/cu121
# For CPU torch:
# uv sync --extra torch

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "extra == 'torch-cu121'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["data_helpers", "models"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
